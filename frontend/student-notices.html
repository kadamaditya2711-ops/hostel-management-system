<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notices | BK's Hostels</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f7fb;
            color: #1f2937;
        }


        .topbar {
            background: #1f3c88;
            color: white;

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .brand {
            font-size: 22px;
            font-weight: bold;
        }


        .back-btn {
            background: white;
            color: #1f3c88;

            border: none;

            padding: 9px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }


        .container {
            width: 92%;
            max-width: 1200px;

            margin: 30px auto;
        }


        .title-box {
            background: white;

            padding: 25px;

            border-radius: 14px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }


        .title-box h1 {
            color: #1f3c88;

            margin-bottom: 8px;
        }


        .title-box p {
            color: #6b7280;
        }


        .message {
            display: none;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;
        }


        .error {
            background: #fee2e2;
            color: #991b1b;
        }


        .notice-list {
            display: grid;

            gap: 18px;
        }


        .notice {
            background: white;

            padding: 22px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);

            border-left: 5px solid #1f3c88;
        }


        .notice-header {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 10px;
        }


        .notice-title {
            color: #1f3c88;

            font-size: 19px;

            font-weight: bold;
        }


        .badge {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            white-space: nowrap;
        }


        .normal {
            background: #e0f2fe;
            color: #075985;
        }


        .important {
            background: #fef3c7;
            color: #92400e;
        }


        .urgent {
            background: #fee2e2;
            color: #991b1b;
        }


        .notice-description {
            color: #4b5563;

            line-height: 1.6;

            margin-bottom: 12px;
        }


        .notice-meta {
            color: #6b7280;

            font-size: 13px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;
        }


        .read-btn {
            background: #1f3c88;

            color: white;

            border: none;

            padding: 7px 12px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 12px;
        }


        .read {
            background: #dcfce7;

            color: #166534;

            padding: 5px 9px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: bold;
        }


        .empty {
            background: white;

            padding: 25px;

            text-align: center;

            color: #6b7280;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }


        footer {
            text-align: center;

            padding: 25px;

            color: #6b7280;
        }


        @media (max-width: 700px) {

            .notice-header {
                flex-direction: column;
            }

            .notice-meta {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="brand">
        BK's Hostels
    </div>


    <button
        class="back-btn"
        onclick="goBack()"
    >
        Back
    </button>

</header>


<main class="container">


    <section class="title-box">

        <h1>
            Hostel Notices
        </h1>

        <p>
            Important announcements and hostel updates.
        </p>

    </section>


    <div
        id="errorMessage"
        class="message error"
    ></div>


    <section
        id="noticeList"
        class="notice-list"
    ></section>


</main>


<footer>

    BK's Hostels —
    Student Portal

</footer>


<script>

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href =
        "student-login.html";

}


function goBack() {

    window.location.href =
        "student-dashboard.html";

}


function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function getPriorityClass(
    priority
) {

    if (priority === "URGENT") {
        return "urgent";
    }

    if (priority === "IMPORTANT") {
        return "important";
    }

    return "normal";
}


function formatDate(date) {

    if (!date) {
        return "-";
    }

    return new Date(date)
        .toLocaleDateString("en-IN");

}


async function loadNotices() {

    try {

        const response =
            await fetch(
                "http://localhost:5000/api/student-extra/notices",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to load notices."
            );

        }


        const notices =
            result.notices || [];


        const container =
            document.getElementById(
                "noticeList"
            );


        if (notices.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No notices available.
                </div>
            `;

            return;
        }


        container.innerHTML =
            notices.map(
                notice => `

                    <article class="notice">

                        <div class="notice-header">

                            <div class="notice-title">
                                ${escapeHtml(
                                    notice.title
                                )}
                            </div>

                            <span class="badge ${
                                getPriorityClass(
                                    notice.priority
                                )
                            }">
                                ${escapeHtml(
                                    notice.priority
                                )}
                            </span>

                        </div>


                        <div class="notice-description">
                            ${escapeHtml(
                                notice.description
                            )}
                        </div>


                        <div class="notice-meta">

                            <span>
                                ${notice.category
                                    ? escapeHtml(
                                        notice.category
                                    )
                                    : "General"
                                }
                                |
                                ${formatDate(
                                    notice.published_at
                                )}
                            </span>


                            ${
                                notice.is_read
                                    ? `
                                        <span class="read">
                                            Read
                                        </span>
                                      `
                                    : `
                                        <button
                                            class="read-btn"
                                            onclick="markRead(
                                                ${notice.notice_id}
                                            )"
                                        >
                                            Mark as Read
                                        </button>
                                      `
                            }

                        </div>

                    </article>

                `
            ).join("");


    } catch (error) {

        console.error(error);


        const box =
            document.getElementById(
                "errorMessage"
            );


        box.textContent =
            error.message;


        box.style.display =
            "block";

    }

}


async function markRead(
    noticeId
) {

    try {

        const response =
            await fetch(
                `http://localhost:5000/api/student-extra/notices/${noticeId}/read`,
                {
                    method: "POST",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to mark notice as read."
            );

        }


        loadNotices();


    } catch (error) {

        console.error(error);

        alert(error.message);

    }

}


loadNotices();

</script>


</body>

</html>
