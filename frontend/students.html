<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - Hostel Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page-container">

    <div class="page-header">

        <div>
            <h1>Student Management</h1>
            <p>Add, search, update and delete students</p>
        </div>

        <button id="backBtn" class="secondary-btn">
            Dashboard
        </button>

    </div>


    <!-- Student Form -->
    <div class="form-card">

        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <div class="form-grid">

                <div>
                    <label>Full Name</label>
                    <input type="text" id="full_name" required>
                </div>

                <div>
                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div>
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>

                <div>
                    <label>Mobile</label>
                    <input type="text" id="mobile" required>
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <div>
                    <label>College Name</label>
                    <input type="text" id="college_name">
                </div>

                <div>
                    <label>Course</label>
                    <input type="text" id="course">
                </div>

                <div>
                    <label>Academic Year</label>
                    <input type="text" id="academic_year" placeholder="2026-27">
                </div>

                <div>
                    <label>Admission Date</label>
                    <input type="date" id="admission_date" required>
                </div>

                <div>
                    <label>Guardian Name</label>
                    <input type="text" id="guardian_name">
                </div>

                <div>
                    <label>Guardian Contact</label>
                    <input type="text" id="guardian_contact">
                </div>

                <div>
                    <label>Emergency Contact</label>
                    <input type="text" id="emergency_contact">
                </div>

            </div>


            <div class="form-group-full">
                <label>Address</label>
                <textarea id="address" rows="3"></textarea>
            </div>


            <div class="button-row">

                <button type="submit" id="saveBtn">
                    Add Student
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="secondary-btn hidden">
                    Cancel
                </button>

            </div>

            <p id="message"></p>

        </form>

    </div>


    <!-- Search -->
    <div class="search-card">

        <h2>Search Students</h2>

        <div class="search-row">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, mobile, email or college">

            <button id="searchBtn">
                Search
            </button>

            <button id="showAllBtn" class="secondary-btn">
                Show All
            </button>

        </div>

    </div>


    <!-- Students Table -->
    <div class="table-card">

        <h2>Students</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Mobile</th>
                        <th>Course</th>
                        <th>Academic Year</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentsTableBody"></tbody>

            </table>

        </div>

    </div>

</div>


<script src="js/students.js"></script>

</body>
</html>
