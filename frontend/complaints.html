<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complaints - Hostel Management System</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="page-container">

    <div class="page-header">

        <div>
            <h1>Complaint Management</h1>
            <p>Submit and manage student complaints</p>
        </div>

        <button id="backBtn" class="secondary-btn">
            Dashboard
        </button>

    </div>


    <!-- Submit Complaint -->

    <div class="form-card">

        <h2>Submit Complaint</h2>

        <form id="complaintForm">

            <div class="form-grid">

                <div>
                    <label>Student</label>

                    <select id="student_id" required>
                        <option value="">
                            Select Student
                        </option>
                    </select>
                </div>

                <div>
                    <label>Category</label>

                    <input
                        type="text"
                        id="category"
                        placeholder="ROOM"
                        required>
                </div>

                <div>
                    <label>Priority</label>

                    <select id="priority">

                        <option value="LOW">
                            LOW
                        </option>

                        <option value="MEDIUM" selected>
                            MEDIUM
                        </option>

                        <option value="HIGH">
                            HIGH
                        </option>

                    </select>
                </div>

                <div>
                    <label>Subject</label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="Fan not working"
                        required>
                </div>

            </div>


            <div class="form-group-full">

                <label>Description</label>

                <textarea
                    id="description"
                    rows="4"
                    placeholder="Enter complaint details"
                    required>
                </textarea>

            </div>


            <button type="submit">
                Submit Complaint
            </button>

            <p id="message"></p>

        </form>

    </div>


    <!-- Complaints -->

    <div class="table-card">

        <h2>All Complaints</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Category</th>
                        <th>Subject</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="complaintsBody"></tbody>

            </table>

        </div>

    </div>

</div>


<script src="js/complaints.js"></script>

</body>
</html>
