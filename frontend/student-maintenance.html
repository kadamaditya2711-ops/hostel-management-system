<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maintenance | BK's Hostels</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .topbar {
            background: #1f3c88;
            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .brand {
            font-size: 22px;

            font-weight: bold;
        }

        .back-btn {
            background: white;

            color: #1f3c88;

            border: none;

            padding: 9px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .container {
            width: 92%;

            max-width: 1200px;

            margin: 30px auto;
        }

        .title-box,
        .section {
            background: white;

            padding: 25px;

            border-radius: 14px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        h1,
        h2 {
            color: #1f3c88;
        }

        .title-box p {
            margin-top: 8px;

            color: #6b7280;
        }

        form {
            display: grid;

            gap: 15px;
        }

        label {
            font-weight: bold;

            font-size: 14px;
        }

        select,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            margin-top: 6px;
        }

        textarea {
            min-height: 120px;

            resize: vertical;
        }

        .submit-btn {
            background: #1f3c88;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .message {
            display: none;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;
        }

        .success {
            background: #dcfce7;

            color: #166534;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;

            text-align: left;

            border-bottom:
                1px solid #e5e7eb;
        }

        th {
            background: #f8fafc;
        }

        .status {
            font-weight: bold;
        }

        .completed {
            color: #166534;
        }

        .pending {
            color: #92400e;
        }

        footer {
            text-align: center;

            padding: 25px;

            color: #6b7280;
        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="brand">
        BK's Hostels
    </div>

    <button
        class="back-btn"
        onclick="goBack()"
    >
        Back
    </button>

</header>


<main class="container">


    <section class="title-box">

        <h1>
            Maintenance Requests
        </h1>

        <p>
            Report room or hostel maintenance problems.
        </p>

    </section>


    <section class="section">

        <h2>
            New Maintenance Request
        </h2>


        <div
            id="message"
            class="message"
        ></div>


        <form id="maintenanceForm">


            <div>

                <label>
                    Category
                </label>

                <select
                    id="category"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    <option value="ELECTRICAL">
                        Electrical
                    </option>

                    <option value="PLUMBING">
                        Plumbing
                    </option>

                    <option value="FURNITURE">
                        Furniture
                    </option>

                    <option value="CLEANLINESS">
                        Cleanliness
                    </option>

                    <option value="FAN">
                        Fan
                    </option>

                    <option value="LIGHT">
                        Light
                    </option>

                    <option value="OTHER">
                        Other
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe the maintenance problem"
                    required
                ></textarea>

            </div>


            <div>

                <label>
                    Priority
                </label>

                <select id="priority">

                    <option value="LOW">
                        Low
                    </option>

                    <option
                        value="MEDIUM"
                        selected
                    >
                        Medium
                    </option>

                    <option value="HIGH">
                        High
                    </option>

                    <option value="EMERGENCY">
                        Emergency
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Submit Request
            </button>


        </form>

    </section>


    <section class="section">

        <h2>
            Maintenance History
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Category
                        </th>

                        <th>
                            Description
                        </th>

                        <th>
                            Priority
                        </th>

                        <th>
                            Hostel
                        </th>

                        <th>
                            Room
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="maintenanceTable"
                >

                </tbody>

            </table>

        </div>

    </section>


</main>


<footer>

    BK's Hostels —
    Student Portal

</footer>


<script>

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href =
        "student-login.html";

}


function goBack() {

    window.location.href =
        "student-dashboard.html";

}


function showMessage(
    text,
    type
) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        text;

    box.className =
        "message " + type;

    box.style.display =
        "block";

}


async function loadMaintenance() {

    try {

        const response =
            await fetch(
                "http://localhost:5000/api/student-services/maintenance",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok) {
            throw new Error(
                result.message
            );
        }


        const requests =
            result.requests || [];


        const table =
            document.getElementById(
                "maintenanceTable"
            );


        if (requests.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6">
                        No maintenance requests found.
                    </td>
                </tr>
            `;

            return;
        }


        table.innerHTML =
            requests.map(
                request => `
                    <tr>

                        <td>
                            ${request.category}
                        </td>

                        <td>
                            ${request.description}
                        </td>

                        <td>
                            ${request.priority}
                        </td>

                        <td>
                            ${request.hostel_name || "-"}
                        </td>

                        <td>
                            ${request.room_number || "-"}
                        </td>

                        <td class="status ${
                            request.status === "COMPLETED"
                                ? "completed"
                                : "pending"
                        }">
                            ${request.status}
                        </td>

                    </tr>
                `
            ).join("");


    } catch (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


document
    .getElementById("maintenanceForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            try {

                const response =
                    await fetch(
                        "http://localhost:5000/api/student-services/maintenance",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                Authorization:
                                    `Bearer ${token}`
                            },

                            body: JSON.stringify({

                                category:
                                    document.getElementById(
                                        "category"
                                    ).value,

                                description:
                                    document.getElementById(
                                        "description"
                                    ).value,

                                priority:
                                    document.getElementById(
                                        "priority"
                                    ).value

                            })
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {
                    throw new Error(
                        result.message
                    );
                }


                showMessage(
                    "Maintenance request submitted successfully.",
                    "success"
                );


                document
                    .getElementById(
                        "maintenanceForm"
                    )
                    .reset();


                loadMaintenance();


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message,
                    "error"
                );

            }

        }
    );


loadMaintenance();

</script>


</body>

</html>
