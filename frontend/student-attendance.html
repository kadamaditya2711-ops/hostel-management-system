<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Attendance | BK's Hostels</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f7fb;
            color: #1f2937;
        }


        .topbar {
            background: #1f3c88;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .brand {
            font-size: 22px;
            font-weight: bold;
        }


        .back-btn {
            background: white;
            color: #1f3c88;
            padding: 9px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }


        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }


        .title-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }


        .title-box h1 {
            color: #1f3c88;
            margin-bottom: 8px;
        }


        .title-box p {
            color: #6b7280;
        }


        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 18px;
            margin-bottom: 25px;
        }


        .card {
            background: white;
            padding: 22px;
            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }


        .card h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }


        .card strong {
            font-size: 25px;
            color: #1f3c88;
        }


        .section {
            background: white;
            padding: 25px;
            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }


        .section h2 {
            color: #1f3c88;
            margin-bottom: 20px;
        }


        .table-wrapper {
            overflow-x: auto;
        }


        table {
            width: 100%;
            border-collapse: collapse;
        }


        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }


        th {
            background: #f8fafc;
        }


        .present {
            color: #166534;
            font-weight: bold;
        }


        .absent {
            color: #991b1b;
            font-weight: bold;
        }


        .empty {
            padding: 20px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            border-radius: 10px;
        }


        .error {
            display: none;
            padding: 15px;
            margin-bottom: 20px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
        }


        footer {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="brand">
        BK's Hostels
    </div>


    <button
        class="back-btn"
        onclick="goBack()"
    >
        Back
    </button>

</header>


<main class="container">


    <div
        id="error"
        class="error"
    ></div>


    <section class="title-box">

        <h1>
            My Attendance
        </h1>

        <p>
            View your attendance history.
        </p>

    </section>


    <section class="cards">


        <div class="card">

            <h3>
                Total Classes
            </h3>

            <strong id="total">
                0
            </strong>

        </div>


        <div class="card">

            <h3>
                Present
            </h3>

            <strong id="present">
                0
            </strong>

        </div>


        <div class="card">

            <h3>
                Absent
            </h3>

            <strong id="absent">
                0
            </strong>

        </div>


        <div class="card">

            <h3>
                Attendance %
            </h3>

            <strong id="percentage">
                0%
            </strong>

        </div>


    </section>


    <section class="section">

        <h2>
            Attendance History
        </h2>


        <div
            id="empty"
            class="empty"
            style="display:none;"
        >
            Attendance has not been marked yet.
        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Date
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Remarks
                        </th>

                    </tr>

                </thead>


                <tbody id="attendanceTable">

                </tbody>

            </table>

        </div>

    </section>

</main>


<footer>

    BK's Hostels —
    Student Portal

</footer>


<script>

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href =
        "student-login.html";

}


function goBack() {

    window.location.href =
        "student-dashboard.html";

}


async function loadAttendance() {

    try {

        const response =
            await fetch(
                "http://localhost:5000/api/student-portal/attendance",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to load attendance."
            );

        }


        const summary =
            result.summary;


        const records =
            result.records || [];


        document.getElementById(
            "total"
        ).textContent =
            summary.total;


        document.getElementById(
            "present"
        ).textContent =
            summary.present;


        document.getElementById(
            "absent"
        ).textContent =
            summary.absent;


        document.getElementById(
            "percentage"
        ).textContent =
            summary.percentage +
            "%";


        const table =
            document.getElementById(
                "attendanceTable"
            );


        if (records.length === 0) {

            document.getElementById(
                "empty"
            ).style.display =
                "block";

            return;

        }


        table.innerHTML =
            records.map(
                record => `

                    <tr>

                        <td>
                            ${record.attendance_date}
                        </td>

                        <td class="${
                            record.status === "PRESENT"
                                ? "present"
                                : "absent"
                        }">
                            ${record.status}
                        </td>

                        <td>
                            ${record.remarks || "-"}
                        </td>

                    </tr>

                `
            ).join("");


    } catch (error) {

        console.error(error);


        const box =
            document.getElementById(
                "error"
            );


        box.textContent =
            error.message;


        box.style.display =
            "block";

    }

}


loadAttendance();

</script>


</body>
</html>
