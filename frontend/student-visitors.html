<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Visitors | BK's Hostels</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f7fb;
            color: #1f2937;
        }


        .topbar {
            background: #1f3c88;
            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .brand {
            font-size: 22px;

            font-weight: bold;
        }


        .back-btn {
            background: white;

            color: #1f3c88;

            border: none;

            padding: 9px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }


        .container {
            width: 92%;

            max-width: 1200px;

            margin: 30px auto;
        }


        .title-box,
        .section {
            background: white;

            padding: 25px;

            border-radius: 14px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }


        .title-box h1,
        .section h2 {
            color: #1f3c88;
        }


        .title-box p {
            color: #6b7280;

            margin-top: 8px;
        }


        .table-wrapper {
            overflow-x: auto;
        }


        table {
            width: 100%;

            border-collapse: collapse;
        }


        th,
        td {
            padding: 13px;

            text-align: left;

            border-bottom:
                1px solid #e5e7eb;
        }


        th {
            background: #f8fafc;
        }


        .status {
            font-weight: bold;
        }


        .inside {
            color: #92400e;
        }


        .completed {
            color: #166534;
        }


        .message {
            display: none;

            padding: 14px;

            border-radius: 8px;

            margin-bottom: 20px;

            background: #fee2e2;

            color: #991b1b;
        }


        .empty {
            padding: 20px;

            text-align: center;

            color: #6b7280;
        }


        footer {
            text-align: center;

            padding: 25px;

            color: #6b7280;
        }


    </style>

</head>


<body>


<header class="topbar">

    <div class="brand">
        BK's Hostels
    </div>


    <button
        class="back-btn"
        onclick="goBack()"
    >
        Back
    </button>

</header>


<main class="container">


    <section class="title-box">

        <h1>
            Visitor History
        </h1>

        <p>
            View your visitor entry and exit history.
        </p>

    </section>


    <div
        id="message"
        class="message"
    ></div>


    <section class="section">

        <h2>
            My Visitors
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Visitor Name
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Relation
                        </th>

                        <th>
                            Purpose
                        </th>

                        <th>
                            Check In
                        </th>

                        <th>
                            Check Out
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="visitorTable">

                </tbody>

            </table>

        </div>

    </section>


</main>


<footer>

    BK's Hostels —
    Student Portal

</footer>


<script>

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href =
        "student-login.html";

}


function goBack() {

    window.location.href =
        "student-dashboard.html";

}


function formatDateTime(value) {

    if (!value) {
        return "-";
    }


    return new Date(value)
        .toLocaleString("en-IN");

}


async function loadVisitors() {

    try {

        const response =
            await fetch(
                "http://localhost:5000/api/student-extra/visitors",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to load visitors."
            );

        }


        const visitors =
            result.visitors || [];


        const table =
            document.getElementById(
                "visitorTable"
            );


        if (visitors.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        No visitor records found.
                    </td>
                </tr>
            `;

            return;
        }


        table.innerHTML =
            visitors.map(
                visitor => `

                    <tr>

                        <td>
                            ${
                                visitor.full_name || "-"
                            }
                        </td>

                        <td>
                            ${
                                visitor.mobile || "-"
                            }
                        </td>

                        <td>
                            ${
                                visitor.relation || "-"
                            }
                        </td>

                        <td>
                            ${
                                visitor.purpose || "-"
                            }
                        </td>

                        <td>
                            ${
                                formatDateTime(
                                    visitor.check_in
                                )
                            }
                        </td>

                        <td>
                            ${
                                formatDateTime(
                                    visitor.check_out
                                )
                            }
                        </td>

                        <td class="status ${
                            visitor.status === "COMPLETED"
                                ? "completed"
                                : "inside"
                        }">

                            ${
                                visitor.status
                            }

                        </td>

                    </tr>

                `
            ).join("");


    } catch (error) {

        console.error(error);


        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            error.message;


        message.style.display =
            "block";

    }

}


loadVisitors();

</script>


</body>

</html>
